name: Malik VIP Bot Auto Run

on:
  workflow_dispatch:
  schedule:
    # Ab bot har 5 minutes baad check karega
    - cron: '*/5 * * * *'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz playwright
          playwright install chromium

      - name: Run Bot Script
        run: python bot.py
