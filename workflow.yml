name: Run Trading Bot

on:
  schedule:
    - cron: '0 5 * * *'  # Pakistan time ke mutabiq subha 10:00 AM par trigger karega
  workflow_dispatch:      # GitHub website se manually run karne ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers
      run: |
        playwright install

    - name: Run Bot
      run: |
        python bot.py
